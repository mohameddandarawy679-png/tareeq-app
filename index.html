<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>طريق الاحتراف من الصفر</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial}
body{
  min-height:100vh;
  background:url('bg.jpg') center/cover no-repeat fixed;
  background-color:#051428;
  display:flex;justify-content:center;align-items:center;padding:20px;
}
.card{width:100%;max-width:420px;text-align:center}
.avatar{
  width:130px;height:130px;object-fit:cover;object-position:top;
  border-radius:50%;border:4px solid #ffce00;
  margin:10px auto;display:block;
}
.stars{color:#ffce00;font-size:32px;letter-spacing:5px;margin:10px 0}
.box{
  background:rgba(5,20,50,.82);border:2px solid #ffce00;
  border-radius:20px;padding:22px;margin-top:15px;
}
.box h2{color:#fff;font-size:28px;margin-bottom:8px}
.box p{color:#fff;font-size:15px;margin-bottom:16px}
.whats{
  display:block;background:#00c853;color:#fff;text-decoration:none;
  padding:14px;border-radius:12px;font-weight:bold;margin-bottom:12px
}
input{
  width:100%;padding:14px;border-radius:12px;border:none;
  font-size:18px;text-align:center;margin-bottom:12px;outline:none
}
.btn{
  width:100%;padding:14px;border:none;border-radius:12px;
  background:#ffce00;font-size:22px;font-weight:bold;cursor:pointer
}
.author{
  margin-top:18px;color:#e8c36a;font-weight:bold;font-size:22px;
  text-shadow:0 2px 8px #000;background:rgba(5,20,50,.7);
  display:inline-block;padding:6px 14px;border-radius:10px
}
</style>
</head>
<body>
<div class="card">
  <img src="profile.jpg" class="avatar">
  <div class="stars">★★★★★</div>
  <div class="box">
    <h2>الكتاب مقفول</h2>
    <p>عشان تفتح الكتاب كلمني وخد كود التفعيل</p>
    <a class="whats" href="https://wa.me/201098920188">اطلب كودك على واتساب - 01098920188</a>
    <input id="code" placeholder="">
    <button class="btn" onclick="check()">تفعيل الكتاب</button>
  </div>
  <div class="author">بقلم: المحترف</div>
</div>
<script>
function check(){
  var v=document.getElementById('code').value.trim();
  if(v==="SN5000"){alert("تم التفعيل ✅");}else{alert("الكود غلط، اطلبه من واتساب");}
}
</script>
</body>
</html>
