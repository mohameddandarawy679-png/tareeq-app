<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>المحترف 😎 - معاك من الصفر لحد متتأسس صح</title>

<style>
*{box-sizing:border-box;font-family:'Segoe UI',Tahoma,sans-serif}
body{margin:0;background:linear-gradient(135deg, #0A1931 0%, #1A3A6B 100%);color:#fff;line-height:1.8;min-height:100vh}
.lang-bar{display:flex;gap:8px;justify-content:center;padding:12px;background:#000;position:sticky;top:0;z-index:99}
.lang-bar button{padding:10px 22px;border-radius:20px;border:1px solid #FFD700;background:#0A1931;color:#fff;cursor:pointer;font-weight:bold;font-size:15px}
.lang-bar button.active{background:#FFD700;color:#0A1931}
.top{padding:40px 20px;text-align:center;border-bottom:3px solid #FFD700}
.top h1{color:#FFD700;font-size:28px;margin:10px 0;line-height:1.4}
.stars{color:#FFD700;font-size:28px;margin:15px 0}
.lock-box{margin:30px auto;max-width:500px;background:#0E2447;border:2px solid #FFD700;border-radius:20px;padding:25px;text-align:center;box-shadow:0 0 20px rgba(255,215,0,0.2)}
.whats{background:#25D366;color:#fff;padding:15px;border-radius:12px;display:block;text-decoration:none;font-weight:bold;margin:15px 0;font-size:18px}
.whats:hover{background:#1ebe5d}
input{width:100%;padding:14px;border-radius:12px;border:none;font-size:16px;text-align:center;margin-bottom:12px;outline:none}
.btn-gold{background:#FFD700;color:#0A1931;padding:15px;border:none;border-radius:12px;width:100%;font-weight:bold;font-size:18px;cursor:pointer;transition:0.3s}
.btn-gold:hover{background:#e6c200}
.book{display:none;padding:15px;max-width:900px;margin:0 auto}
.sec{background:#FFD700;color:#0A1931;padding:12px;border-radius:12px;text-align:center;font-weight:bold;font-size:22px;margin:30px 0 15px}
.lesson{background:#122A52;border:1px solid #FFD700;border-radius:16px;padding:20px;margin-bottom:25px;box-shadow:0 4px 10px rgba(0,0,0,0.3)}
.lesson h3{color:#FFD700;font-size:22px;margin:0 0 12px}

/* تنسيق خطوات الشرح */
.explain-steps{margin:15px 0}
.step-item{background:#0E2447;padding:12px 15px;border-radius:10px;margin-bottom:10px;border-right:4px solid #25D366;font-size:16px;position:relative}
.step-item::before{content:"💡";margin-left:8px}

/* تنسيق الكود */
.code-box{background:#000;border-radius:10px;margin:15px 0;overflow:hidden;border:1px solid #333}
.code-header{background:#1a1a1a;padding:8px 15px;border-bottom:1px solid #333}
.code-header span{color:#aaa;font-size:14px}
.code-content{background:#000;padding:15px;direction:ltr;text-align:left;color:#7CFF7C;font-size:15px;font-family:monospace;white-space:pre-wrap;margin:0}

/* تنسيق التطبيق العملي */
.try{background:#1A3A6B;padding:15px;border-radius:10px;border-right:4px solid #FFD700;margin:15px 0;font-weight:bold}

/* تنسيق السؤال والجواب */
.quiz-box{background:#0E2447;padding:15px;border-radius:10px;border-right:4px solid #c084fc;margin:15px 0;font-size:16px;font-weight:bold}
.btn-ans{background:#c084fc;color:#fff;border:none;padding:10px 20px;border-radius:8px;cursor:pointer;font-weight:bold;margin-top:10px;width:100%;font-size:16px}
.ans{display:none;background:#000;padding:15px;border-radius:8px;margin-top:10px;color:#7CFF7C;direction:ltr;text-align:left;font-family:monospace;white-space:pre-wrap;border:1px solid #c084fc}
.footer{margin-top:40px;padding:20px;text-align:center;border-top:1px solid #FFD700;color:#FFD700}
</style>
</head>
<body>

<div class="lang-bar">
<button id="btn-ar" class="active" onclick="setLang('ar')">🇪🇬 العربية</button>
<button id="btn-en" onclick="setLang('en')">🇺🇸 English</button>
</div>

<div id="lockScreen">
<div class="top">
<h1>المحترف 😎 - معاك من الصفر لحد متتأسس صح</h1>
<div class="stars">★★★★★ 5/5</div>
<p>موسوعة تأسيس البرمجة من الصفر لسوق العمل</p>
</div>
<div class="lock-box">
<h2>🔒 الدخول للمشتركين فقط</h2>
<p>اكتب كود التفعيل الخاص بك</p>
<a class="whats" href="https://wa.me/201098920188?text=مرحباً، أريد الحصول على كود تفعيل المحترف" target="_blank">📱 تواصل واتساب: 01098920188</a>
<input id="codeInput" type="password" placeholder="">
<button class="btn-gold" onclick="activate()">افتح الموسوعة الآن 🔓</button>
<p id="msg" style="color:#FFD700;font-weight:bold;min-height:20px;margin-top:10px"></p>
</div>
</div>

<div id="bookScreen" class="book">
<div class="top">
<h1>المحترف 😎 - معاك من الصفر لحد متتأسس صح</h1>
<p>شرح مكثف + أكواد + أسئلة وإجابات</p>
</div>
<div id="lessonsContainer"></div>
<div class="footer"><p>© 2026 المحترف 😎</p></div>
</div>

<script>
// ====== التفعيل ======
const VALID_CODES = Array.from({length: 50}, (_, i) => "snsn" + (i + 1));

function activate(){
  const code = document.getElementById('codeInput').value.trim();
  if(VALID_CODES.includes(code)){
    document.getElementById('lockScreen').style.display='none';
    document.getElementById('bookScreen').style.display='block';
    localStorage.setItem('proBookUnlocked','yes');
  } else {
    document.getElementById('msg').textContent = "كود غلط، جرب تاني أو اطلبه من واتساب.";
  }
}
window.onload = function() {
    if(localStorage.getItem('proBookUnlocked') === 'yes'){
      document.getElementById('lockScreen').style.display='none';
      document.getElementById('bookScreen').style.display='block';
    }
};

// ====== اللغة ======
function setLang(lang){
  document.getElementById('btn-ar').classList.toggle('active', lang==='ar');
  document.getElementById('btn-en').classList.toggle('active', lang==='en');
}

// ====== عرض الإجابة ======
function toggleAns(id){
  const el = document.getElementById(id);
  el.style.display = el.style.display === 'block' ? 'none' : 'block';
}

// ====== بيانات الدروس ======
const lessons = [
  {
    section: "المرحلة التمهيدية: ما هي البرمجة؟",
    title: "الدرس 1: عقل الكمبيوتر وإزاي بيفهم؟",
    steps: [
      "الكمبيوتر جهاز سريع جداً لكنه لا يفهم العربية ولا الإنجليزية، هو يفهم فقط لغة الآلة (أصفار وآحاد).",
      "عشان كده إحنا بنكتب الكود بلغات سهلة زي Python، وفي الخلفية فيه برنامج (Interpreter) بيترجم الكود لأصفار وآحاد عشان الكمبيوتر ينفذه.",
      "البرمجة هي ببساطة: كتابة أوامر منطقية ومتسلسلة لحل مشكلة معينة."
    ],
    code: 'print("مرحبا بك في عالم البرمجة!")\nprint("الكمبيوتر ينفذ الأوامر بالترتيب.")',
    practice: "اكتب كود يطبع اسمك، ثم وظيفتك المستقبلية (مبرمج محترف)، ثم عمرك.",
    quiz: "لو كتبت أوامر مش مترتبة، الكمبيوتر هيفهمها؟",
    answer: 'print("أحمد محمد")\nprint("مبرمج محترف")\nprint(20)',
    quizAns: "لأ، الكمبيوتر بينفذ الأوامر بالترتيب اللي إحنا بنكتبه بالظبط، عشان كده لازم الترتيب يكون صح."
  },
  {
    section: "المرحلة الأولى: تأسيس Python",
    title: "الدرس 2: المتغيرات (المخازن الذكية)",
    steps: [
      "المتغير هو 'علبة' في ذاكرة الكمبيوتر بنحط فيها بيانات عشان نستخدمها بعدين.",
      "في بايثون، مش بنحتاج نكتب نوع العلبة (زي int أو string)، بايثون بيفهم النوع لوحده.",
      "القواعد: الاسم يبدأ بحرف أو _، وميكونش فيه مسافات، وحساس لحالة الأحرف (الـ age غير الـ Age)."
    ],
    code: 'name = "Youssef"\nage = 25\nsalary = 5000.50\nis_programmer = True\n\nprint("الاسم:", name)\nprint("العمر:", age)\nprint("هل هو مبرمج؟", is_programmer)',
    practice: "أنشئ متغيرات لاسمك، مدينتك، وسنوات خبرتك، ثم اطبعهم في سطر واحد باستخدام فاصلة.",
    quiz: "لو كتبت اسم المتغير 2name، هيشتغل؟",
    answer: 'my_name = "Ali"\nmy_city = "Cairo"\nexp_years = 2\nprint(my_name, my_city, exp_years)',
    quizAns: "لأ، لأن اسم المتغير لازم يبدأ بحرف أو underscore (_)، ومينفعش يبدأ برقم."
  },
  {
    section: "المرحلة الأولى: تأسيس Python",
    title: "الدرس 3: أنواع البيانات والعمليات الحسابية",
    steps: [
      "أنواع البيانات الأساسية: int (أرقام صحيحة)، float (أرقام عشرية)، str (نصوص)، bool (True/False).",
      "العمليات الحسابية: الجمع +، الطرح -، الضرب *، القسمة /، القسمة الصحيحة //، باقي القسمة %، والأس **."
    ],
    code: 'x = 15\ny = 4\nprint("الجمع:", x + y)\nprint("القسمة:", x / y)\nprint("باقي القسمة:", x % y)\nprint("الأس:", x ** 2)',
    practice: "احسب مساحة مستطيل طوله 10 وعرضه 5، واطبع النتيجة مع كلمة 'المساحة هي:'.",
    quiz: "إيه الفرق بين / و // في بايثون؟",
    answer: 'length = 10\nwidth = 5\narea = length * width\nprint("المساحة هي:", area)',
    quizAns: "الـ / بترجع رقم عشري (float) زي 3.5، بينما الـ // بترجع الجزء الصحيح من القسمة بس (int) زي 3."
  },
  {
    section: "المرحلة الأولى: تأسيس Python",
    title: "الدرس 4: الشروط (if, elif, else)",
    steps: [
      "الشروط هي 'مخ البرنامج'. عشان البرنامج ياخد قرار، بنستخدم if (لو)، elif (لو كان شرط تاني)، else (غير كده).",
      "لازم الشرط ينتهي بنقطتين (:)، والكود اللي جواه يكون مزاح (Indented) بمسافة."
    ],
    code: 'grade = 85\n\nif grade >= 90:\n    print("ممتاز")\nelif grade >= 75:\n    print("جيد جداً")\nelif grade >= 50:\n    print("ناجح")\nelse:\n    print("راسب")',
    practice: "اكتب برنامج يحدد إذا كان الرقم زوجي (Even) أم فردي (Odd).",
    quiz: "لو عندي شرطين متتاليين if و elif، هل الاتنين هيتنفذوا لو الشرط الأول صح؟",
    answer: 'num = 7\nif num % 2 == 0:\n    print("زوجي")\nelse:\n    print("فردي")',
    quizAns: "لأ، elif بيتنفذ بس لو الشرط اللي قبله (if) كان غلط. أول شرط يتحقق، الباقي بيتجاهل."
  }
];

// ====== توليد الـ HTML ======
const container = document.getElementById('lessonsContainer');
let currentSection = "";

lessons.forEach((l, i) => {
  if(l.section !== currentSection){
    currentSection = l.section;
    container.insertAdjacentHTML('beforeend', `<div class="sec">${currentSection}</div>`);
  }

  // تجهيز الخطوات
  let stepsHtml = "";
  l.steps.forEach(s => {
    stepsHtml += `<div class="step-item">${s}</div>`;
  });

  const displayCode = l.code.replace(/</g, '&lt;').replace(/>/g, '&gt;');
  const displayAns = l.answer.replace(/</g, '&lt;').replace(/>/g, '&gt;');

  const html = `
    <div class="lesson">
      <h3>${l.title}</h3>
      
      <div class="explain-steps">
        <strong style="color:#FFD700;">📖 خطوات الشرح:</strong><br>
        ${stepsHtml}
      </div>

      <div class="code-box">
        <div class="code-header">
          <span>تطبيق الكود (Python 3)</span>
        </div>
        <pre class="code-content">${displayCode}</pre>
      </div>

      <div class="try">🎯 التطبيق العملي: ${l.practice}</div>

      <div class="quiz-box">
        ❓ سؤال للتقييم: ${l.quiz}
        <button class="btn-ans" onclick="toggleAns('ans${i}')">👁️ شوف الإجابة</button>
        <div class="ans" id="ans${i}">
          <strong>الحل:</strong><br>${l.quizAns}<br><br>
          <strong>الكود:</strong><br>${displayAns}
        </div>
      </div>
    </div>
  `;
  container.insertAdjacentHTML('beforeend', html);
});
</script>
</body>
</html>
