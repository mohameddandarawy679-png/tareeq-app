// ====== بناء الدروس ======
function renderLessons() {
  const container = document.getElementById('lessonsContainer');
  container.innerHTML = "";
  let currentSection = "";
  const lang = currentLang;

  lessons.forEach((l, i) => {
    const secText = l['section_' + lang];
    if(secText !== currentSection){
      currentSection = secText;
      container.insertAdjacentHTML('beforeend', `<div class="sec">${currentSection}</div>`);
    }

    let stepsHtml = "";
    l['steps_' + lang].forEach(s => {
      stepsHtml += `<div class="step-item">${s}</div>`;
    });

    // تجهيز الكود للعرض الآمن
    const displayCode = l.code.replace(/</g, '&lt;').replace(/>/g, '&gt;');
    const displayAns = l.answer.replace(/</g, '&lt;').replace(/>/g, '&gt;');

    const html = `
      <div class="lesson">
        <h3>${l['title_' + lang]}</h3>
        <div class="explain-steps">
          <strong style="color:#FFD700;">${lang === 'ar' ? '📖 خطوات الشرح:' : '📖 Steps:'}</strong><br>
          ${stepsHtml}
        </div>
        <div class="code-box">
          <div class="code-header"><span>${lang === 'ar' ? 'تطبيق الكود' : 'Code Example'}</span></div>
          <pre class="code-content">${displayCode}</pre>
        </div>
        <div class="try">${lang === 'ar' ? '🎯 التطبيق العملي: ' : '🎯 Practice: '} ${l['practice_' + lang]}</div>
        <div class="quiz-box">
          ${lang === 'ar' ? '❓ سؤال للتقييم: ' : '❓ Quiz: '} ${l['quiz_' + lang]}
          <button class="btn-ans" onclick="toggleAns('ans${i}')">${lang === 'ar' ? '👁️ شوف الإجابة' : '👁️ Show Answer'}</button>
          <div class="ans" id="ans${i}">
            <strong>${lang === 'ar' ? 'الحل:' : 'Answer:'}</strong><br>${l['quizAns_' + lang]}<br><br>
            <strong>${lang === 'ar' ? 'الكود:' : 'Code:'}</strong><br>${displayAns}
          </div>
        </div>
      </div>
    `;
    container.insertAdjacentHTML('beforeend', html);
  });
}

renderLessons();
</script>
